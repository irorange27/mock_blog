name: pnpm ci

env:
  CI: true

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: restore node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: install dependencies
        run: pnpm install

      - name: typecheck Worker
        run: pnpm typecheck:worker

      - name: test
        run: pnpm test -- --run

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: restore node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: install dependencies
        run: pnpm install

      - name: generate
        run: pnpm generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
